    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Locate My Bus",
      "url": "https://bus.ranjitpandey.dev/",
      "description": "Live bus tracker for Halifax Transit and other GTFS-RT enabled agencies. Real-time vehicle positions on a map, refreshed every 15 seconds.",

    <!-- Apply persisted theme before paint to avoid a flash.
         localStorage access can throw in privacy modes / embedded
         browsers — fall back to dark in that case so the page still
         boots and renders sensibly. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('lmb-theme');
          if (saved === 'light') theme = 'light';
        } catch (e) { /* storage blocked; use default */ }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7KKXW54Z0W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7KKXW54Z0W');
    </script>
