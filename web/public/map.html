<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7KKXW54Z0W"></script>
    <script src="/assets/analytics.js"></script>
    <title>Live Map — Locate My Bus</title>
    <link rel="stylesheet" href="/leaflet/leaflet.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="/assets/base.css">
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
            else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
            else document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="stylesheet" href="/assets/map.css">
</head>
<body>

<header class="site-header">
    <a href="/" class="brand">Locate My Bus</a>
    <div class="header-right">
        <a href="/" class="back-link">← Home</a>
        <button id="theme-toggle"></button>
    </div>
</header>

<div id="map">
    <div id="controls">
        <select id="agency-select" disabled>
            <option value="">Loading agencies…</option>
        </select>
        <select id="route-select" disabled>
            <option value="">Select agency first</option>
        </select>
        <label style="font-size:0.8rem;color:var(--text);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;">
            <input type="checkbox" id="running-only" checked>
            Running routes only
        </label>
        <div id="poll-timer" style="font-size:0.72rem;color:var(--text);opacity:0.65;text-align:right;">polling in: —</div>
        <button id="locate-btn" title="Show my location on the map">◎ Show my location</button>
        <div id="location-error" style="display:none;font-size:0.72rem;color:#e53935;flex-direction:column;gap:4px;">
            <span id="location-error-msg"></span>
            <button id="location-retry-btn" style="background:none;border:1px solid #e53935;color:#e53935;border-radius:4px;padding:3px 6px;font-family:inherit;font-size:0.72rem;cursor:pointer;align-self:flex-start;">Try again</button>
        </div>
        <button id="details-toggle">▸ Agency details</button>
        <div id="agency-details">
            <span id="detail-phone"></span>
            <span id="detail-url"></span>
            <span id="detail-fare"></span>
        </div>
    </div>
</div>

<script src="/leaflet/leaflet.js"></script>
<script>
    /* ── Theme toggle ── */
    (function () {
        const btn = document.getElementById('theme-toggle');
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            btn.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
        }
        btn.addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            applyTheme(next);
        });
        applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    })();

    /* ── HTML escaping ── */
    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    /* ── Map ── */
    const map = L.map('map', { zoomControl: true }).setView([44.6488, -63.5752], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    function makeBusIcon(head_bearing, pinned) {
        // Icon faces LEFT (west = 90° aka -90°), so add 90° to align with bearing
        const deg    = (head_bearing != null && Number.isFinite(head_bearing)) ? head_bearing + 90 : 0;
        return L.divIcon({
            html: `<div style="transform:rotate(${deg}deg);transform-origin:center;font-size:24px;">
                    🚌
                </div>`,
            className: '',
            iconSize: [24, 24],
            iconAnchor: [12, 12],
        });
    }

    let markers = [];
    let ageTimer = null;
    let pollTimer = null;
    let countdownTimer = null;
    let pinnedVehicleId = null;
    let manuallyPinned = false;
    let routeLayers = [];
    let userLat = null;
    let userLng = null;
    const POLL_INTERVAL = 15000;

    function haversineMeters(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const toRad = x => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function clearRoute() {
        routeLayers.forEach(l => l.remove());
        routeLayers = [];
    }

    function drawRoute(agencyId, tripId) {
        clearRoute();
        fetch(`/api/shape/${agencyId}/${tripId}`)
            .then(r => r.json())
            .then(response => {
                const points = response.rows;
                if (!points.length) return;
                const latlngs = points
                    .sort((a, b) => a.pt_sequence - b.pt_sequence)
                    .map(p => [p.pt_lat, p.pt_lon]);

                const base = L.polyline(latlngs, { color: '#1558d0', weight: 4, opacity: 0.4 }).addTo(map);

                const dashes = L.polyline(latlngs, { color: '#1558d0', weight: 4, opacity: 0.9, dashArray: '12 8' }).addTo(map);
                dashes.getElement().style.animation = 'dash-flow 1.8s linear infinite';

                const startDot = L.circleMarker(latlngs[0], { radius: 6, color: '#fff', weight: 2, fillColor: '#e53935', fillOpacity: 1 }).addTo(map);
                const endDot   = L.circleMarker(latlngs[latlngs.length - 1], { radius: 6, color: '#fff', weight: 2, fillColor: '#2e7d32', fillOpacity: 1 }).addTo(map);

                routeLayers.push(base, dashes, startDot, endDot);
            })
            .catch(err => console.error('Shape fetch failed:', err));
    }

    const pollTimerEl = document.getElementById('poll-timer');

    function startCountdown() {
        clearInterval(countdownTimer);
        let secs = POLL_INTERVAL / 1000;
        pollTimerEl.textContent = `polling in: ${secs}s`;
        countdownTimer = setInterval(() => {
            secs--;
            if (secs <= 0) {
                pollTimerEl.textContent = 'updating…';
            } else {
                pollTimerEl.textContent = `polling in: ${secs}s`;
            }
        }, 1000);
    }

    const savedAgency = localStorage.getItem('selected-agency');
    const savedRoute  = localStorage.getItem('selected-route');

    const agencySelect = document.getElementById('agency-select');
    const routeSelect  = document.getElementById('route-select');

    /* ── Persist zoom ── */
    const savedZoom = parseInt(localStorage.getItem('map-zoom'), 10);
    const savedLat  = parseFloat(localStorage.getItem('map-lat'));
    const savedLon  = parseFloat(localStorage.getItem('map-lon'));
    let hasSavedPosition = Number.isFinite(savedZoom) && Number.isFinite(savedLat) && Number.isFinite(savedLon);
    if (hasSavedPosition) {
        map.setView([savedLat, savedLon], savedZoom);
    }
    map.on('moveend zoomend', () => {
        const c = map.getCenter();
        localStorage.setItem('map-zoom', map.getZoom());
        localStorage.setItem('map-lat', c.lat);
        localStorage.setItem('map-lon', c.lng);
    });

    let hasAutocentered = false;

    /* ── Clear & redraw markers ── */
    function drawVehicles(vehicles) {
        markers.forEach(m => m.remove());
        markers = [];

        if (!vehicles.length) return;

        // Auto-pin nearest bus to user if no manual pin
        if (userLat !== null && !manuallyPinned) {
            let nearest = null;
            let minDist = Infinity;
            vehicles.forEach(v => {
                const d = (v.lat - userLat) ** 2 + (v.lon - userLng) ** 2;
                if (d < minDist) { minDist = d; nearest = v; }
            });
            if (nearest && nearest.vehicle_id !== pinnedVehicleId) {
                pinnedVehicleId = nearest.vehicle_id;
                drawRoute(agencySelect.value, nearest.trip_id);
            }
        }

        const pinned = vehicles.find(v => v.vehicle_id === pinnedVehicleId);

        if (pinned) {
            // Keep pinned bus centered, don't touch zoom
            map.setView([pinned.lat, pinned.lon], map.getZoom(), { animate: true });
        } else if (!hasAutocentered && !hasSavedPosition) {
            const avgLat = vehicles.reduce((s, v) => s + v.lat, 0) / vehicles.length;
            const avgLon = vehicles.reduce((s, v) => s + v.lon, 0) / vehicles.length;
            map.setView([avgLat, avgLon], 13);
            hasAutocentered = true;
        }

        vehicles.forEach(v => {
            const isPinned = v.vehicle_id === pinnedVehicleId;
            const age = Math.round((Date.now() - Date.parse(v.timestamp)) / 1000);
            const distLine = (userLat !== null)
                ? (() => {
                    const d = haversineMeters(userLat, userLng, v.lat, v.lon);
                    return `<br><b>Distance:</b> ${d < 1000 ? Math.round(d) + 'm' : (d / 1000).toFixed(1) + 'km'} away`;
                })()
                : '';
            const popup = L.popup({ offset: [0, -28], autoPan: false })
                .setContent(
                    `<b>Trip:</b> ${escapeHtml(v.trip_id)}<br>` +
                    `<b>Route:</b> ${escapeHtml(v.route_id)}<br>` +
                    `<b>Vehicle:</b> ${escapeHtml(v.vehicle_id)}<br>` +
                    `<b>Speed:</b> ${v.speed != null ? escapeHtml(v.speed) : '—'} m/s<br>` +
                    `<b>Bearing:</b> ${v.head_bearing != null ? escapeHtml(v.head_bearing) + '°' : '—'}<br>` +
                    `<b>Updated:</b> <span class="age-counter">${age}</span>s ago` +
                    distLine
                );

            const marker = L.marker([v.lat, v.lon], { icon: makeBusIcon(v.head_bearing, isPinned) })
                .addTo(map)
                .bindPopup(popup);

            marker.on('click', () => {
                if (pinnedVehicleId === v.vehicle_id) {
                    pinnedVehicleId = null;
                    manuallyPinned = false;
                    clearRoute();
                } else {
                    pinnedVehicleId = v.vehicle_id;
                    manuallyPinned = true;
                    map.setView([v.lat, v.lon], map.getZoom(), { animate: true });
                    drawRoute(agencySelect.value, v.trip_id);
                }
            });

            marker.on('popupopen', () => {
                clearInterval(ageTimer);
                const startTime = Date.parse(v.timestamp);
                const ageEl = popup.getElement().querySelector('.age-counter');
                ageTimer = setInterval(() => {
                    ageEl.textContent = String(Math.round((Date.now() - startTime) / 1000));
                }, 1000);
            });

            marker.on('popupclose', () => {
                clearInterval(ageTimer);
                ageTimer = null;
            });

            if (isPinned) marker.openPopup();

            markers.push(marker);
        });
    }

    /* ── Click map background to unpin ── */
    map.on('click', () => { pinnedVehicleId = null; manuallyPinned = false; clearRoute(); });

    /* ── User location ── */
    let locationWatchId = null;
    let locationMarker  = null;
    let locationCircle  = null;
    const locateBtn       = document.getElementById('locate-btn');
    const locationErrorEl = document.getElementById('location-error');
    const locationErrorMsg = document.getElementById('location-error-msg');

    function showLocationError(msg) {
        locationErrorMsg.textContent = msg;
        locationErrorEl.style.display = 'flex';
    }

    function hideLocationError() {
        locationErrorEl.style.display = 'none';
    }

    function stopLocation() {
        if (locationWatchId !== null) {
            navigator.geolocation.clearWatch(locationWatchId);
            locationWatchId = null;
        }
        if (locationMarker) { locationMarker.remove(); locationMarker = null; }
        if (locationCircle) { locationCircle.remove(); locationCircle = null; }
        locateBtn.classList.remove('active');
        locateBtn.textContent = '◎ Show my location';
    }

    function onLocationUpdate(pos) {
        const { latitude: lat, longitude: lng, accuracy } = pos.coords;
        userLat = lat;
        userLng = lng;
        hideLocationError();

        if (!locationMarker) {
            const icon = L.divIcon({
                html: '<div class="user-location-marker"><div class="user-location-dot"></div></div>',
                className: '',
                iconSize: [16, 16],
                iconAnchor: [8, 8],
            });
            locationMarker = L.marker([lat, lng], { icon, zIndexOffset: 500 })
                .addTo(map)
                .bindPopup('You are here');
            locationCircle = L.circle([lat, lng], { radius: accuracy, color: '#2979ff', weight: 1, fillColor: '#2979ff', fillOpacity: 0.1 }).addTo(map);
            map.setView([lat, lng], map.getZoom(), { animate: true });
            locateBtn.textContent = '◎ My location';
        } else {
            locationMarker.setLatLng([lat, lng]);
            locationCircle.setLatLng([lat, lng]).setRadius(accuracy);
        }
    }

    function onLocationError(err) {
        if (err.code === err.PERMISSION_DENIED) {
            stopLocation();
            showLocationError('Location access denied. Enable it in your browser settings, then try again.');
        } else if (err.code === err.POSITION_UNAVAILABLE) {
            // CoreLocation (macOS) fires this transiently while still trying — keep the watch alive
            locateBtn.textContent = '◎ Locating…';
        } else if (err.code === err.TIMEOUT) {
            // High-accuracy timed out — silently retry with low accuracy (WiFi/IP-based)
            navigator.geolocation.clearWatch(locationWatchId);
            locationWatchId = navigator.geolocation.watchPosition(
                onLocationUpdate,
                (err2) => { stopLocation(); showLocationError('Could not get your location.'); },
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
            );
        }
    }

    function startLocation() {
        if (!navigator.geolocation || locationWatchId !== null) return;
        hideLocationError();
        locateBtn.classList.add('active');
        locateBtn.textContent = '◎ Locating…';
        locationWatchId = navigator.geolocation.watchPosition(
            onLocationUpdate,
            onLocationError,
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
    }

    locateBtn.addEventListener('click', () => {
        if (locationWatchId !== null) {
            stopLocation();
        } else {
            startLocation();
        }
    });

    document.getElementById('location-retry-btn').addEventListener('click', startLocation);

    startLocation();

    /* ── Fetch live vehicles for current selection ── */
    function fetchLive() {
        const agencyId = agencySelect.value;
        const routeId  = routeSelect.value;
        if (!agencyId || !routeId) return;

        fetch(`/live/${agencyId}/${routeId}`)
            .then(r => r.json())
            .then(drawVehicles)
            .catch(err => console.error('Live fetch failed:', err));
    }

    /* ── Start/restart polling ── */
    function startPolling() {
        clearInterval(pollTimer);
        clearInterval(countdownTimer);
        hasAutocentered = false;
        pinnedVehicleId = null;
        manuallyPinned = false;
        clearRoute();
        fetchLive();
        startCountdown();
        pollTimer = setInterval(() => {
            fetchLive();
            if (document.getElementById('running-only').checked) refreshRouteList(agencySelect.value);
            startCountdown();
        }, POLL_INTERVAL);
    }

    /* ── Populate route select for a given agency ── */
    function loadRoutes(agencyId, restoreRoute = false) {
        const runningOnly = document.getElementById('running-only').checked;
        routeSelect.disabled = true;
        routeSelect.innerHTML = '<option value="">Loading routes…</option>';

        fetch(`/routes/${agencyId}/${runningOnly ? '1' : '0'}`)
            .then(r => r.json())
            .then(routes => {
                routeSelect.innerHTML = '';
                routes.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.long_name
                        ? `${r.id} — ${r.long_name}`
                        : (r.id);
                    if (restoreRoute && savedRoute && r.id === savedRoute) opt.selected = true;
                    routeSelect.appendChild(opt);
                });
                routeSelect.disabled = false;
                startPolling();
            })
            .catch(err => {
                console.error('Routes fetch failed:', err);
                routeSelect.innerHTML = '<option value="">Failed to load routes</option>';
            });
    }

    /* ── Refresh route list during polling (preserves selection) ── */
    function refreshRouteList(agencyId) {
        const prevValue = routeSelect.value;
        fetch(`/routes/${agencyId}/1`)
            .then(r => r.json())
            .then(routes => {
                routeSelect.innerHTML = '';
                routes.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.long_name
                        ? `${r.id} — ${r.long_name}`
                        : (r.id);
                    if (r.id === prevValue) opt.selected = true;
                    routeSelect.appendChild(opt);
                });
                routeSelect.disabled = false;
            })
            .catch(err => console.error('Routes refresh failed:', err));
    }

    /* ── Agency details panel ── */
    let agenciesCache = [];

    function safeHref(raw) {
        if (!raw) return null;
        try {
            const url = new URL(raw);
            if (url.protocol !== 'https:' && url.protocol !== 'http:') return null;
            return url.href;
        } catch {
            return null;
        }
    }

    function makeLink(raw, label) {
        const href = safeHref(raw);
        if (!href) return null;
        const a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = label ?? href;
        return a;
    }

    function updateDetails(agencyId) {
        const a = agenciesCache.find(x => x.id === agencyId);
        if (!a) return;

        const phoneEl = document.getElementById('detail-phone');
        const urlEl   = document.getElementById('detail-url');
        const fareEl  = document.getElementById('detail-fare');

        phoneEl.textContent = a.phone ? `📞 ${a.phone}` : '';

        urlEl.textContent = '';
        const urlLink = makeLink(a.url, a.url);
        if (urlLink) { urlEl.textContent = '🌐 '; urlEl.appendChild(urlLink); }

        fareEl.textContent = '';
        const fareLink = makeLink(a.fare_url, 'Fare info');
        if (fareLink) { fareEl.textContent = '🎫 '; fareEl.appendChild(fareLink); }
    }

    document.getElementById('details-toggle').addEventListener('click', function () {
        const panel = document.getElementById('agency-details');
        const open  = panel.classList.toggle('open');
        this.textContent = (open ? '▾' : '▸') + ' Agency details';
    });

    /* ── Populate agency select ── */
    fetch('/api/agencies')
        .then(r => r.json())
        .then(agencies => {
            agenciesCache = agencies;
            agencySelect.innerHTML = '';
            agencies.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.id;
                opt.textContent = a.name ?? a.id;
                // restore saved, otherwise first in list wins
                if (savedAgency ? a.id === savedAgency : opt === agencySelect.firstChild) {
                    opt.selected = true;
                }
                agencySelect.appendChild(opt);
            });
            // if saved agency wasn't found in list, fall back to first
            if (!agencySelect.value && agencies.length) {
                agencySelect.options[0].selected = true;
            }
            agencySelect.disabled = false;
            updateDetails(agencySelect.value);
            loadRoutes(agencySelect.value, /* restoreRoute */ true);
        })
        .catch(err => {
            console.error('Agencies fetch failed:', err);
            agencySelect.innerHTML = '<option value="">Failed to load agencies</option>';
        });

    /* ── Select change handlers ── */
    agencySelect.addEventListener('change', () => {
        localStorage.setItem('selected-agency', agencySelect.value);
        // clear saved map position so it re-centres on the new city
        localStorage.removeItem('map-zoom');
        localStorage.removeItem('map-lat');
        localStorage.removeItem('map-lon');
        hasAutocentered = false;
        hasSavedPosition = false;
        updateDetails(agencySelect.value);
        loadRoutes(agencySelect.value, /* restoreRoute */ false);
    });
    routeSelect.addEventListener('change', () => {
        localStorage.setItem('selected-route', routeSelect.value);
        startPolling();
    });
    document.getElementById('running-only').addEventListener('change', () => {
        loadRoutes(agencySelect.value, /* restoreRoute */ false);
    });
</script>

        var banner = document.getElementById('bmc-banner');

        banner.classList.remove('hidden');
        closeBtn.addEventListener('click', function () {
            banner.classList.add('hidden');
            localStorage.setItem('bmc-banner-dismissed', '1');
        });
    })();
</script>
