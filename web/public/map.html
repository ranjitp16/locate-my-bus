<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7KKXW54Z0W"></script>
    <script src="/assets/analytics.js"></script>
    <title>Live Map — Locate My Bus</title>
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="/assets/base.css">
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
            else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
            else document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="stylesheet" href="/assets/map.css">
</head>
<body>

<header class="site-header">
    <a href="/" class="brand">Locate My Bus</a>
    <div class="header-right">
        <a href="/" class="back-link">← Home</a>
        <button id="theme-toggle"></button>
    </div>
</header>

<div id="map">
    <div id="map-left-controls">
        <button id="drop-pin-btn" data-tip="Drop pin" aria-label="Drop pin">&#128205;</button>
        <button id="my-location-btn" data-tip="My location" aria-label="My location"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg></button>
        <button id="stop-tracking-btn" data-tip="Stop tracking" aria-label="Stop tracking" style="display:none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4" y1="4" x2="20" y2="20" stroke-width="2.5"/></svg></button>
        <button id="trip-btn" data-tip="Plan trip" aria-label="Plan trip" style="display:none;">🗺️</button>
    </div>
    <div id="controls">
        <div id="controls-header">
            <div id="poll-timer">polling in: —</div>
            <button id="controls-toggle" title="Collapse controls" aria-label="Collapse controls" aria-expanded="true" aria-controls="controls">▾</button>
        </div>
        <select id="agency-select" disabled>
            <option value="">Loading agencies…</option>
        </select>
        <select id="route-select" disabled>
            <option value="">Select agency first</option>
        </select>
        <label style="font-size:0.8rem;color:var(--text);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;">
            <input type="checkbox" id="running-only" checked>
            Running routes only
        </label>
        <button id="poll-toggle-btn" title="Pause or resume live polling">⏸ Stop polling</button>
        <button id="details-toggle">▸ Agency details</button>
        <div id="agency-details">
            <span id="detail-phone"></span>
            <span id="detail-url"></span>
            <span id="detail-fare"></span>
        </div>
    </div>
    <div id="trip-sheet">
        <div id="trip-sheet-handle"></div>
        <div id="trip-sheet-title">
            <span>Plan Trip</span>
            <button id="trip-close-btn" style="background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);">✕</button>
        </div>
        <div id="trip-inputs">
            <div class="trip-origin-row">
                <span style="font-size:0.85rem;">📍</span>
                <div class="trip-origin-pill">My Location</div>
            </div>
            <div class="trip-dest-row">
                <span style="font-size:0.85rem;">🏁</span>
                <input type="text" id="trip-dest-input" placeholder="Where to? (address or drop pin)" autocomplete="off">
                <button id="trip-dest-pin-btn" aria-label="Drop destination pin">📌</button>
            </div>
        </div>
        <div id="geocode-dropdown"></div>
        <div id="trip-loading" style="display:none;">
            <div class="spinner"></div>
            <div style="margin-top:6px;">Finding best routes...</div>
        </div>
        <div id="trip-results" style="display:none;"></div>
    </div>
</div>

<script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
<script src="/assets/map-adapter-azure.js"></script>
<script>
    /* ── Theme toggle ── */
    (function () {
        const btn = document.getElementById('theme-toggle');
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            btn.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
        }
        btn.addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            applyTheme(next);
        });
        applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    })();

    /* ── Controls collapse ── */
    (function () {
        const toggle   = document.getElementById('controls-toggle');
        const controls = document.getElementById('controls');
        function setCollapsed(on) {
            controls.classList.toggle('collapsed', on);
            toggle.textContent = on ? '▸' : '▾';
            toggle.title = on ? 'Expand controls' : 'Collapse controls';
            toggle.setAttribute('aria-expanded', String(!on));
            toggle.setAttribute('aria-label', on ? 'Expand controls' : 'Collapse controls');
            localStorage.setItem('controls-collapsed', on ? '1' : '0');
        }
        toggle.addEventListener('click', function () {
            setCollapsed(!controls.classList.contains('collapsed'));
        });
        setCollapsed(localStorage.getItem('controls-collapsed') === '1');
    })();

    /* ── Map ── */
    let ageTimer = null;
    let pollTimer = null;
    let countdownTimer = null;
    let pinnedVehicleId = null;
    let manuallyPinned = false;
    let pinnedCentered = false;
    let userLat = null;
    let userLng = null;
    let lastStops = [];
    const POLL_INTERVAL = 15000;

    // ── Init Azure Maps adapter ──
    // Read saved position before init so the map opens at the right place
    const savedZoom = parseInt(localStorage.getItem('map-zoom'), 10);
    const savedLat  = parseFloat(localStorage.getItem('map-lat'));
    const savedLon  = parseFloat(localStorage.getItem('map-lon'));
    let hasSavedPosition = Number.isFinite(savedZoom) && Number.isFinite(savedLat) && Number.isFinite(savedLon);

    mapAdapter.init('map', {
        center: hasSavedPosition ? { lat: savedLat, lng: savedLon } : { lat: 44.6488, lng: -63.5752 },
        zoom:   hasSavedPosition ? savedZoom : 13,
    });

    mapAdapter.onMoveEnd(function ({ lat, lng, zoom }) {
        localStorage.setItem('map-zoom', zoom);
        localStorage.setItem('map-lat', lat);
        localStorage.setItem('map-lon', lng);
    });

    mapAdapter.onClick(function () {
        pinnedVehicleId = null;
        manuallyPinned  = false;
        pinnedCentered = false;
        mapAdapter.closeOpenPopup();
        clearRoute();
    });

    mapAdapter.onMarkerClick(function ({ vehicleId, lat, lon, tripId }) {
        if (pinnedVehicleId === vehicleId) {
            pinnedVehicleId = null;
            manuallyPinned  = false;
            pinnedCentered = false;
            clearRoute();
        } else {
            pinnedVehicleId = vehicleId;
            pinnedCentered = false;
            manuallyPinned  = true;
            mapAdapter.setView(lat, lon, mapAdapter.getZoom(), true);
            drawRoute(agencySelect.value, tripId);
        }
    });

    mapAdapter.onMarkerPopupOpen(function () {
        clearInterval(ageTimer);
        ageTimer = setInterval(function () {
            const el = document.querySelector('.popup-content-container .age-counter, .atlas-popup-content-container .age-counter');
            if (!el) return;
            const ts = parseInt(el.dataset.ts, 10);
            if (Number.isFinite(ts)) el.textContent = String(Math.round((Date.now() - ts) / 1000));
        }, 1000);
    });

    mapAdapter.onMarkerPopupClose(function () {
        clearInterval(ageTimer);
        ageTimer = null;
    });

    function haversineMeters(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const toRad = x => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function clearRoute() {
        mapAdapter.clearRoute();
        mapAdapter.clearStopMarkers();
        lastStops = [];
    }

    function drawRoute(agencyId, tripId) {
        clearRoute();
        fetch(`/api/shape/${agencyId}/${tripId}`)
            .then(r => r.json())
            .then(response => {
                const points = response.rows;
                if (!points.length) return;
                const sorted = points
                    .sort((a, b) => a.pt_sequence - b.pt_sequence)
                    .map(p => ({ lat: p.pt_lat, lon: p.pt_lon }));
                mapAdapter.drawRoute(sorted);
            })
            .catch(err => console.error('Shape fetch failed:', err));

        // Fetch stops in parallel
        fetch(`/api/stops/${agencyId}/${tripId}`)
            .then(r => r.json())
            .then(stops => {
                lastStops = stops;
                if (stops.length) mapAdapter.updateStopMarkers(stops, userLat, userLng);
            })
            .catch(err => console.error('Stops fetch failed:', err));
    }

    const pollTimerEl = document.getElementById('poll-timer');

    function startCountdown() {
        clearInterval(countdownTimer);
        let secs = POLL_INTERVAL / 1000;
        pollTimerEl.textContent = `polling in: ${secs}s`;
        countdownTimer = setInterval(() => {
            secs--;
            if (secs <= 0) {
                pollTimerEl.textContent = 'updating…';
            } else {
                pollTimerEl.textContent = `polling in: ${secs}s`;
            }
        }, 1000);
    }

    const savedAgency = localStorage.getItem('selected-agency');
    const savedRoute  = localStorage.getItem('selected-route');

    const agencySelect = document.getElementById('agency-select');
    const routeSelect  = document.getElementById('route-select');

    let hasAutocentered = false;

    /* ── Clear & redraw markers ── */
    function drawVehicles(vehicles) {
        if (!vehicles.length) {
            mapAdapter.updateBusMarkers([], null, userLat, userLng);
            return;
        }

        // Auto-pin nearest bus to user if no manual pin
        if (userLat !== null && !manuallyPinned) {
            let nearest = null, minDist = Infinity;
            vehicles.forEach(v => {
                const d = haversineMeters(userLat, userLng, v.lat, v.lon);
                if (d < minDist) { minDist = d; nearest = v; }
            });
            if (nearest && nearest.vehicle_id !== pinnedVehicleId) {
                pinnedVehicleId = nearest.vehicle_id;
                pinnedCentered = false;
                drawRoute(agencySelect.value, nearest.trip_id);
            }
        }

        const pinned = vehicles.find(v => v.vehicle_id === pinnedVehicleId);
        if (pinned && !pinnedCentered) {
            mapAdapter.setView(pinned.lat, pinned.lon, mapAdapter.getZoom(), true);
            pinnedCentered = true;
        } else if (!hasAutocentered && !hasSavedPosition) {
            const avgLat = vehicles.reduce((s, v) => s + v.lat, 0) / vehicles.length;
            const avgLon = vehicles.reduce((s, v) => s + v.lon, 0) / vehicles.length;
            mapAdapter.setView(avgLat, avgLon, 13);
            hasAutocentered = true;
        }

        mapAdapter.updateBusMarkers(vehicles, pinnedVehicleId, userLat, userLng);
    }

    /* ── User location ── */
    let locationWatchId = null;
    let locationMarker  = null;
    const dropPinBtn       = document.getElementById('drop-pin-btn');
    const myLocationBtn    = document.getElementById('my-location-btn');
    const stopTrackingBtn  = document.getElementById('stop-tracking-btn');

    function stopLocation() {
        if (locationWatchId !== null) {
            navigator.geolocation.clearWatch(locationWatchId);
            locationWatchId = null;
        }
        mapAdapter.clearUserLocation();
        locationMarker = null;
        userLat = null;
        userLng = null;
        dropPinBtn.classList.remove('active');
        myLocationBtn.classList.remove('active');
        stopTrackingBtn.style.display = 'none';
        showTripBtn();
    }

    function onLocationUpdate(pos) {
        const { latitude: lat, longitude: lng, accuracy } = pos.coords;
        userLat = lat;
        userLng = lng;

        const firstTime = !locationMarker;
        mapAdapter.setUserLocation(lat, lng, accuracy);
        locationMarker = true;
        myLocationBtn.classList.add('active');
        stopTrackingBtn.style.display = '';

        if (firstTime) {
            mapAdapter.setView(lat, lng, 13, true);
        }
        showTripBtn();
    }

    function showLocationDenied() {
        const existing = document.getElementById('loc-denied-msg');
        if (existing) existing.remove();
        const msg = document.createElement('div');
        msg.id = 'loc-denied-msg';
        msg.textContent = 'Location access denied. Enable it in browser settings.';
        document.getElementById('map').appendChild(msg);
        setTimeout(function () { msg.remove(); }, 5000);
    }

    function onLocationError(err) {
        if (err.code === err.PERMISSION_DENIED) {
            stopLocation();
            showLocationDenied();
        } else if (err.code === err.TIMEOUT) {
            navigator.geolocation.clearWatch(locationWatchId);
            locationWatchId = navigator.geolocation.watchPosition(
                onLocationUpdate,
                onLocationError,
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
            );
        }
        // POSITION_UNAVAILABLE: keep watch alive (macOS CoreLocation transient)
    }

    if (!navigator.geolocation) {
        myLocationBtn.style.display = 'none';
    }

    function startLocation() {
        if (!navigator.geolocation || locationWatchId !== null) return;
        dropPinBtn.classList.remove('active');
        myLocationBtn.classList.add('active');
        stopTrackingBtn.style.display = '';
        locationWatchId = navigator.geolocation.watchPosition(
            onLocationUpdate,
            onLocationError,
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
    }

    dropPinBtn.addEventListener('click', () => {
        stopLocation();
        const center = mapAdapter.getCenter();
        userLat = center.lat;
        userLng = center.lng;
        locationMarker = true;
        dropPinBtn.classList.add('active');
        stopTrackingBtn.style.display = '';
        mapAdapter.dropLocationPin(center.lat, center.lng, (lat, lng) => {
            userLat = lat;
            userLng = lng;
            if (lastStops.length) mapAdapter.updateStopMarkers(lastStops, userLat, userLng);
        });
        if (lastStops.length) mapAdapter.updateStopMarkers(lastStops, userLat, userLng);
        showTripBtn();
    });

    myLocationBtn.addEventListener('click', () => {
        stopLocation();
        startLocation();
    });

    stopTrackingBtn.addEventListener('click', () => {
        stopLocation();
    });

    startLocation();

    /* ── Trip planning mode ── */
    let tripMode = false;
    let destLat = null;
    let destLng = null;
    let tripOptions = null;
    let selectedTripIdx = 0;
    const tripBtn = document.getElementById('trip-btn');
    const tripSheet = document.getElementById('trip-sheet');
    const tripCloseBtn = document.getElementById('trip-close-btn');
    const tripDestInput = document.getElementById('trip-dest-input');
    const tripDestPinBtn = document.getElementById('trip-dest-pin-btn');
    const tripLoading = document.getElementById('trip-loading');
    const tripResults = document.getElementById('trip-results');
    const geocodeDropdown = document.getElementById('geocode-dropdown');
    const controlsEl = document.getElementById('controls');

    function showTripBtn() {
        tripBtn.style.display = (userLat !== null && agencySelect.value) ? '' : 'none';
    }

    function enterTripMode() {
        tripMode = true;
        tripBtn.classList.add('active');
        controlsEl.style.display = 'none';
        tripSheet.classList.add('open');
        destLat = null;
        destLng = null;
        tripOptions = null;
        tripResults.style.display = 'none';
        tripLoading.style.display = 'none';
        tripDestInput.value = '';
        document.getElementById('trip-inputs').style.display = '';
        mapAdapter.clearRoute();
        mapAdapter.clearStopMarkers();
    }

    function exitTripMode() {
        tripMode = false;
        tripBtn.classList.remove('active');
        controlsEl.style.display = '';
        tripSheet.classList.remove('open');
        geocodeDropdown.classList.remove('open');
        mapAdapter.clearDestinationPin();
        mapAdapter.clearTripPlan();
        destLat = null;
        destLng = null;
        tripOptions = null;
        // Restore normal polling
        if (!pollingPaused && agencySelect.value && routeSelect.value) {
            fetchLive();
        }
    }

    tripBtn.addEventListener('click', function () {
        if (tripMode) exitTripMode();
        else enterTripMode();
    });

    tripCloseBtn.addEventListener('click', exitTripMode);

    /* ── Geocoding and destination ── */
    tripDestInput.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const query = tripDestInput.value.trim();
        if (!query) return;
        geocodeAddress(query);
    });

    async function geocodeAddress(query) {
        try {
            const res = await fetch('/api/azure-maps/geocoding?api-version=2023-06-01&query=' + encodeURIComponent(query) + '&top=5', {
                headers: { 'X-Azure-Maps-Proxy': '1' }
            });
            const data = await res.json();
            const features = data.features || [];
            if (!features.length) {
                geocodeDropdown.innerHTML = '<div class="geocode-item" style="color:var(--text-muted);">No results found</div>';
                geocodeDropdown.classList.add('open');
                return;
            }
            geocodeDropdown.innerHTML = '';
            features.forEach(function (f) {
                const item = document.createElement('div');
                item.className = 'geocode-item';
                item.textContent = f.properties?.address?.formattedAddress || f.properties?.address?.freeformAddress || query;
                item.addEventListener('click', function () {
                    const coords = f.geometry.coordinates; // [lng, lat]
                    setDestination(coords[1], coords[0], item.textContent);
                    geocodeDropdown.classList.remove('open');
                });
                geocodeDropdown.appendChild(item);
            });
            geocodeDropdown.classList.add('open');
        } catch (err) {
            console.error('Geocoding failed:', err);
        }
    }

    document.addEventListener('click', function (e) {
        if (!geocodeDropdown.contains(e.target) && e.target !== tripDestInput) {
            geocodeDropdown.classList.remove('open');
        }
    });

    function setDestination(lat, lng, name) {
        destLat = lat;
        destLng = lng;
        tripDestInput.value = name || (lat.toFixed(4) + ', ' + lng.toFixed(4));
        mapAdapter.setDestinationPin(lat, lng, function (newLat, newLng) {
            destLat = newLat;
            destLng = newLng;
            tripDestInput.value = newLat.toFixed(4) + ', ' + newLng.toFixed(4);
            computeTrip();
        });
        mapAdapter.setView(lat, lng, mapAdapter.getZoom(), true);
        computeTrip();
    }

    tripDestPinBtn.addEventListener('click', function () {
        const center = mapAdapter.getCenter();
        setDestination(center.lat, center.lng, null);
    });

    /* ── Trip computation and results ── */
    async function computeTrip() {
        if (destLat === null || userLat === null) return;
        const agencyId = agencySelect.value;
        if (!agencyId) return;

        tripLoading.style.display = '';
        tripResults.style.display = 'none';
        document.getElementById('trip-inputs').style.display = 'none';
        mapAdapter.clearTripPlan();

        try {
            const res = await fetch('/api/trip-plan/' + agencyId +
                '?originLat=' + userLat + '&originLng=' + userLng +
                '&destLat=' + destLat + '&destLng=' + destLng);
            const data = await res.json();
            tripLoading.style.display = 'none';

            if (!data.options || !data.options.length) {
                tripResults.innerHTML = '<div style="padding:12px 0;text-align:center;color:var(--text-muted);font-size:0.8rem;">' +
                    (data.error || 'No routes found for this trip.') + '</div>';
                tripResults.style.display = '';
                return;
            }

            tripOptions = data.options;
            selectedTripIdx = 0;
            renderTripResults();
            selectTripOption(0);
        } catch (err) {
            console.error('Trip plan failed:', err);
            tripLoading.style.display = 'none';
            tripResults.innerHTML = '<div style="padding:12px 0;text-align:center;color:var(--text-muted);font-size:0.8rem;">Trip planning failed. Try again.</div>';
            tripResults.style.display = '';
        }
    }

    function formatMinutes(secs) {
        const m = Math.round(secs / 60);
        return m < 1 ? '< 1 min' : m + ' min';
    }

    function renderTripResults() {
        let html = '<div class="trip-summary-row"><span>📍 My Location → 🏁 ' +
            (tripDestInput.value.length > 25 ? tripDestInput.value.substring(0, 25) + '…' : tripDestInput.value) +
            '</span><a id="trip-edit-link">Edit</a></div>';

        tripOptions.forEach(function (opt, idx) {
            let legsHtml = '';
            opt.legs.forEach(function (leg, li) {
                if (li > 0) legsHtml += '<span class="arrow">→</span>';
                if (leg.type === 'walk') {
                    legsHtml += '<span class="walk">🚶' + formatMinutes(leg.durationSeconds) + '</span>';
                } else if (leg.type === 'bus') {
                    const color = leg.routeColor || '#1558d0';
                    let name = leg.routeName || leg.routeId;
                    if (name.length > 12) name = name.substring(0, 12) + '…';
                    legsHtml += '<span class="trip-leg-badge" style="background:' + color + ';">' + name + '</span>';
                }
            });

            let detailHtml = '';
            opt.legs.forEach(function (leg) {
                if (leg.type === 'walk') {
                    detailHtml += 'Walk to <b>' + (leg.to.name || 'next stop') + '</b> (' + leg.distanceMeters + 'm)<br>';
                } else if (leg.type === 'bus') {
                    const boardTimeStr = leg.boardTime ? leg.boardTime.substring(0, 5) : '';
                    detailHtml += 'Board <b>' + (leg.routeName || leg.routeId) + '</b>' +
                        (boardTimeStr ? ' (~' + boardTimeStr + ')' : '') +
                        ' · ' + (leg.numStops || '?') + ' stops<br>' +
                        'Alight at <b>' + (leg.alightStop.name || 'stop') + '</b><br>';
                }
            });

            html += '<div class="trip-option' + (idx === selectedTripIdx ? ' selected' : '') + '" data-trip-idx="' + idx + '">' +
                '<div class="trip-option-header">' +
                '<div class="trip-option-time">' + formatMinutes(opt.totalTime) + '</div>' +
                '<div class="trip-option-label">' + (opt.label || '') + '</div>' +
                '</div>' +
                '<div class="trip-option-legs">' + legsHtml + '</div>' +
                '<div class="trip-option-details">' + detailHtml + '</div>' +
                '</div>';
        });

        html += '<div class="trip-show-all"><label><input type="checkbox" id="trip-show-all-toggle"> Show all buses on route</label></div>';

        tripResults.innerHTML = html;
        tripResults.style.display = '';

        tripResults.querySelectorAll('.trip-option').forEach(function (el) {
            el.addEventListener('click', function () {
                selectTripOption(parseInt(el.dataset.tripIdx, 10));
            });
        });

        const editLink = document.getElementById('trip-edit-link');
        if (editLink) {
            editLink.addEventListener('click', function (e) {
                e.stopPropagation();
                tripResults.style.display = 'none';
                document.getElementById('trip-inputs').style.display = '';
                tripDestInput.focus();
            });
        }

        const showAllToggle = document.getElementById('trip-show-all-toggle');
        if (showAllToggle) {
            showAllToggle.addEventListener('change', function () {
                fetchTripBuses(showAllToggle.checked);
            });
        }
    }

    async function selectTripOption(idx) {
        selectedTripIdx = idx;
        tripResults.querySelectorAll('.trip-option').forEach(function (el, i) {
            el.classList.toggle('selected', i === idx);
        });

        const opt = tripOptions[idx];
        if (!opt) return;

        const enrichedLegs = [];
        for (let i = 0; i < opt.legs.length; i++) {
            const leg = Object.assign({}, opt.legs[i]);
            if (leg.type === 'walk' && leg.from && leg.to) {
                const query = leg.from.lat + ',' + leg.from.lng + ':' + leg.to.lat + ',' + leg.to.lng;
                try {
                    const walkRes = await fetch('/api/azure-maps/route/directions/json?api-version=1.0&query=' +
                        encodeURIComponent(query) + '&travelMode=pedestrian&routeType=shortest', {
                        headers: { 'X-Azure-Maps-Proxy': '1' }
                    });
                    const walkData = await walkRes.json();
                    if (walkData.routes && walkData.routes[0] && walkData.routes[0].legs) {
                        const pts = [];
                        walkData.routes[0].legs.forEach(function (wl) {
                            wl.points.forEach(function (p) { pts.push({ lat: p.latitude, lng: p.longitude }); });
                        });
                        leg.walkPath = pts;
                        const summary = walkData.routes[0].summary;
                        leg.distanceMeters = summary.lengthInMeters;
                        leg.durationSeconds = summary.travelTimeInSeconds;
                    }
                } catch (e) { console.error('Walk route fetch failed:', e); }
            } else if (leg.type === 'bus' && leg.tripId) {
                try {
                    const shapeRes = await fetch('/api/shape/' + agencySelect.value + '/' + leg.tripId);
                    const shapeData = await shapeRes.json();
                    if (shapeData.rows && shapeData.rows.length) {
                        const sorted = shapeData.rows
                            .sort(function (a, b) { return a.pt_sequence - b.pt_sequence; })
                            .map(function (p) { return { lat: p.pt_lat, lon: p.pt_lon }; });
                        leg.shapePath = sorted;
                    }
                } catch (e) { console.error('Shape fetch failed:', e); }
            }
            enrichedLegs.push(leg);
        }

        mapAdapter.drawTripPlan(enrichedLegs);
        fetchTripBuses(document.getElementById('trip-show-all-toggle')?.checked || false);
    }

    async function fetchTripBuses(showAll) {
        const opt = tripOptions[selectedTripIdx];
        if (!opt) return;

        const busLegs = opt.legs.filter(function (l) { return l.type === 'bus'; });
        const routeIds = busLegs.map(function (l) { return l.routeId; });
        const pinnedIds = busLegs.map(function (l) { return l.vehicleId; }).filter(Boolean);
        const agencyId = agencySelect.value;

        const allVehicles = [];
        for (let ri = 0; ri < routeIds.length; ri++) {
            try {
                const res = await fetch('/live/' + agencyId + '/' + routeIds[ri]);
                const vehicles = await res.json();
                if (showAll) {
                    allVehicles.push(...vehicles);
                } else {
                    const legVehicleId = busLegs[ri].vehicleId;
                    if (legVehicleId) {
                        const found = vehicles.find(function (v) { return v.vehicle_id === legVehicleId; });
                        if (found) allVehicles.push(found);
                    }
                }
            } catch (e) { console.error('Live fetch for trip bus failed:', e); }
        }

        if (allVehicles.length) {
            mapAdapter.showTripBuses(allVehicles, pinnedIds);
        }
    }

    /* ── Fetch live vehicles for current selection ── */
    function fetchLive() {
        const agencyId = agencySelect.value;
        const routeId  = routeSelect.value;
        if (!agencyId || !routeId) return;

        fetch(`/live/${agencyId}/${routeId}`)
            .then(r => r.json())
            .then(drawVehicles)
            .catch(err => console.error('Live fetch failed:', err));
    }

    /* ── Start/restart polling ── */
    function startPolling() {
        clearInterval(pollTimer);
        clearInterval(countdownTimer);
        hasAutocentered = false;
        pinnedVehicleId = null;
        pinnedCentered = false;
        manuallyPinned = false;
        clearRoute();
        fetchLive();
        startCountdown();
        pollTimer = setInterval(() => {
            fetchLive();
            if (document.getElementById('running-only').checked) refreshRouteList(agencySelect.value);
            startCountdown();
        }, POLL_INTERVAL);
    }

    /* ── Poll toggle ── */
    let pollingPaused = false;
    const pollToggleBtn = document.getElementById('poll-toggle-btn');
    pollToggleBtn.addEventListener('click', function () {
        if (pollingPaused) {
            // Resume
            pollingPaused = false;
            pollToggleBtn.textContent = '⏸ Stop polling';
            pollToggleBtn.classList.remove('active');
            fetchLive();
            startCountdown();
            pollTimer = setInterval(() => {
                fetchLive();
                if (document.getElementById('running-only').checked) refreshRouteList(agencySelect.value);
                startCountdown();
            }, POLL_INTERVAL);
        } else {
            // Pause
            pollingPaused = true;
            clearInterval(pollTimer);
            clearInterval(countdownTimer);
            pollTimer = null;
            pollToggleBtn.textContent = '▶ Resume polling';
            pollToggleBtn.classList.add('active');
            pollTimerEl.textContent = 'polling paused';
        }
    });

    /* ── Populate route select for a given agency ── */
    function loadRoutes(agencyId, restoreRoute = false) {
        const runningOnly = document.getElementById('running-only').checked;
        routeSelect.disabled = true;
        routeSelect.innerHTML = '<option value="">Loading routes…</option>';

        fetch(`/routes/${agencyId}/${runningOnly ? '1' : '0'}`)
            .then(r => r.json())
            .then(routes => {
                routeSelect.innerHTML = '';
                routes.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.long_name
                        ? `${r.id} — ${r.long_name}`
                        : (r.id);
                    if (restoreRoute && savedRoute && r.id === savedRoute) opt.selected = true;
                    routeSelect.appendChild(opt);
                });
                routeSelect.disabled = false;
                startPolling();
            })
            .catch(err => {
                console.error('Routes fetch failed:', err);
                routeSelect.innerHTML = '<option value="">Failed to load routes</option>';
            });
    }

    /* ── Refresh route list during polling (preserves selection) ── */
    function refreshRouteList(agencyId) {
        const prevValue = routeSelect.value;
        fetch(`/routes/${agencyId}/1`)
            .then(r => r.json())
            .then(routes => {
                routeSelect.innerHTML = '';
                routes.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.long_name
                        ? `${r.id} — ${r.long_name}`
                        : (r.id);
                    if (r.id === prevValue) opt.selected = true;
                    routeSelect.appendChild(opt);
                });
                routeSelect.disabled = false;
            })
            .catch(err => console.error('Routes refresh failed:', err));
    }

    /* ── Agency details panel ── */
    let agenciesCache = [];

    function safeHref(raw) {
        if (!raw) return null;
        try {
            const url = new URL(raw);
            if (url.protocol !== 'https:' && url.protocol !== 'http:') return null;
            return url.href;
        } catch {
            return null;
        }
    }

    function makeLink(raw, label) {
        const href = safeHref(raw);
        if (!href) return null;
        const a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = label ?? href;
        return a;
    }

    function updateDetails(agencyId) {
        const a = agenciesCache.find(x => x.id === agencyId);
        if (!a) return;

        const phoneEl = document.getElementById('detail-phone');
        const urlEl   = document.getElementById('detail-url');
        const fareEl  = document.getElementById('detail-fare');

        phoneEl.textContent = a.phone ? `📞 ${a.phone}` : '';

        urlEl.textContent = '';
        const urlLink = makeLink(a.url, a.url);
        if (urlLink) { urlEl.textContent = '🌐 '; urlEl.appendChild(urlLink); }

        fareEl.textContent = '';
        const fareLink = makeLink(a.fare_url, 'Fare info');
        if (fareLink) { fareEl.textContent = '🎫 '; fareEl.appendChild(fareLink); }
    }

    document.getElementById('details-toggle').addEventListener('click', function () {
        const panel = document.getElementById('agency-details');
        const open  = panel.classList.toggle('open');
        this.textContent = (open ? '▾' : '▸') + ' Agency details';
    });

    /* ── Populate agency select ── */
    fetch('/api/agencies')
        .then(r => r.json())
        .then(agencies => {
            agenciesCache = agencies;
            agencySelect.innerHTML = '';
            agencies.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.id;
                opt.textContent = a.name ?? a.id;
                // restore saved, otherwise first in list wins
                if (savedAgency ? a.id === savedAgency : opt === agencySelect.firstChild) {
                    opt.selected = true;
                }
                agencySelect.appendChild(opt);
            });
            // if saved agency wasn't found in list, fall back to first
            if (!agencySelect.value && agencies.length) {
                agencySelect.options[0].selected = true;
            }
            agencySelect.disabled = false;
            updateDetails(agencySelect.value);
            loadRoutes(agencySelect.value, /* restoreRoute */ true);
            showTripBtn();
        })
        .catch(err => {
            console.error('Agencies fetch failed:', err);
            agencySelect.innerHTML = '<option value="">Failed to load agencies</option>';
        });

    /* ── Select change handlers ── */
    agencySelect.addEventListener('change', () => {
        localStorage.setItem('selected-agency', agencySelect.value);
        // clear saved map position so it re-centres on the new city
        localStorage.removeItem('map-zoom');
        localStorage.removeItem('map-lat');
        localStorage.removeItem('map-lon');
        hasAutocentered = false;
        hasSavedPosition = false;
        updateDetails(agencySelect.value);
        loadRoutes(agencySelect.value, /* restoreRoute */ false);
    });
    routeSelect.addEventListener('change', () => {
        localStorage.setItem('selected-route', routeSelect.value);
        startPolling();
    });
    document.getElementById('running-only').addEventListener('change', () => {
        loadRoutes(agencySelect.value, /* restoreRoute */ false);
    });
</script>
