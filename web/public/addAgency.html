<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7KKXW54Z0W"></script>
    <script src="/assets/analytics.js"></script>
    <title>Add a new Agency</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
    <script>
        /* Apply saved/OS theme before paint to avoid flash */
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body style="padding-top: 48px; padding-bottom: 40px;">

<header class="site-header">
    <a href="/" class="brand">Locate My Bus</a>
    <div class="header-right">
        <a href="/" class="back-link">← Home</a>
        <button id="theme-toggle"></button>
    </div>
</header>

<div id="banner" role="alert">
    <span id="banner-msg"></span>
    <button id="banner-close" onclick="hideBanner()">✕</button>
</div>

<div class="container-xl px-4 py-4">

    <h4 class="mb-3 fw-semibold">Existing Agencies</h4>

    <div class="card shadow-sm mb-5">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>URL</th>
                            <th>Timezone</th>
                            <th>Language</th>
                            <th>Phone</th>
                            <th>Fare URL</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="agency-tbody">
                        <tr id="empty-row">
                            <td colspan="7" class="text-center py-4">No agencies added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <h4 class="mb-3 fw-semibold">Add a new Agency</h4>
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <form id="add-form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="rt_feed_url" class="form-label">
                            Realtime Feed URL <span class="text-danger" data-bs-toggle="tooltip" title="Required. Add the URL for the realtime GTFS feed.">*</span>
                        </label>
                        <input type="url" class="form-control" id="rt_feed_url" name="rt_feed_url" maxlength="1000" required>
                    </div>
                    <div class="col-md-6">
                        <label for="static_feed_url" class="form-label">
                            Static Feed URL <span class="text-danger"  data-bs-toggle="tooltip" title="Required. Add the URL for the static GTFS feed.">*</span>
                        </label>
                        <input type="url" class="form-control" id="static_feed_url" name="static_feed_url" maxlength="1000" required>
                    </div>
                    <div class="col-md-6 pt-1">
                        <label for="api_key" class="form-label">
                            API key <span class="text-info" data-bs-toggle="tooltip" title="Optional. Add this if your agency requires an API key in the headers.">?</span>
                        </label>
                        <input type="text" class="form-control" id="api_key" name="api_key" maxlength="1000">
                    </div>
                    <div class="col-md-6 pt-1 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary px-4">Add Agency</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>

<!-- Add agency access key modal -->
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title" id="addModalLabel">Confirm Add Agency</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-2">
                <label for="add-access-key" class="form-label">Access Key</label>
                <input type="password" class="form-control" id="add-access-key" placeholder="Enter access key">
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-sm px-3" data-bs-dismiss="modal" style="background:var(--surface-alt);color:var(--text);border:1px solid var(--border);">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm px-3" id="add-confirm-btn">Add Agency</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title" id="deleteModalLabel">Delete Agency</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-2">
                <p id="delete-modal-msg" class="mb-3">Are you sure you want to delete this agency? This cannot be undone.</p>
                <label for="delete-access-key" class="form-label">Access Key</label>
                <input type="password" class="form-control" id="delete-access-key" placeholder="Enter access key">
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-sm px-3" data-bs-dismiss="modal" style="background:var(--surface-alt);color:var(--text);border:1px solid var(--border);">Cancel</button>
                <button type="button" class="btn btn-danger btn-sm px-3" id="delete-confirm-btn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous">
</script>

<script>
    /* ── Banner ── */
    let bannerTimer = null;

    function showBanner(msg) {
        const el = document.getElementById('banner');
        document.getElementById('banner-msg').textContent = msg;
        el.classList.add('show', 'error');
        clearTimeout(bannerTimer);
        bannerTimer = setTimeout(hideBanner, 6000);
    }

    function hideBanner() {
        const el = document.getElementById('banner');
        el.classList.remove('show', 'error');
        clearTimeout(bannerTimer);
    }

    /* ── Theme toggle ── */
    (function () {
        const btn = document.getElementById('theme-toggle');

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            btn.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
        }

        btn.addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            applyTheme(next);
        });

        // Sync label with whatever theme was applied before paint
        applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    })();

    /* ── Table helpers ── */

    // Only allow http/https to prevent javascript: or data: URLs
    function safeHref(raw) {
        if (!raw) return null;
        try {
            const url = new URL(raw);
            if (url.protocol !== 'https:' && url.protocol !== 'http:') return null;
            return url.href;
        } catch {
            return null;
        }
    }

    // Returns a <td> built entirely with DOM APIs — no innerHTML interpolation
    function urlCell(raw) {
        const td = document.createElement('td');
        td.className = 'url-cell';
        const safe = safeHref(raw);
        if (!safe) {
            td.textContent = '—';
            return td;
        }
        const a = document.createElement('a');
        a.href = safe;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = safe;
        a.style.color = 'var(--accent)';
        const icon = document.createElement('i');
        icon.className = 'fa-solid fa-arrow-up-right-from-square fa-sm';
        a.appendChild(icon);
        td.appendChild(a);
        return td;
    }

    function loadAgencies() {
        fetch('/api/agencies')
            .then(r => r.json())
            .then(agencies => {
                const tbody = document.getElementById('agency-tbody');
                const emptyRow = document.getElementById('empty-row');

                if (agencies.length > 0 && emptyRow) emptyRow.remove();

                agencies.forEach(a => {
                    const tr = document.createElement('tr');
                    tr.dataset.id = a.id;

                    const tdName = document.createElement('td');
                    const strong = document.createElement('strong');
                    strong.textContent = a.name || '—';
                    tdName.appendChild(strong);
                    tr.appendChild(tdName);

                    tr.appendChild(urlCell(a.url));

                    const tdTz = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = a.timezone || '—';
                    tdTz.appendChild(badge);
                    tr.appendChild(tdTz);

                    const tdLang = document.createElement('td');
                    tdLang.textContent = a.language || '—';
                    tr.appendChild(tdLang);

                    const tdPhone = document.createElement('td');
                    tdPhone.textContent = a.phone || '—';
                    tr.appendChild(tdPhone);

                    tr.appendChild(urlCell(a.fare_url));

                    const tdDel = document.createElement('td');
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn btn-outline-danger btn-sm';
                    delBtn.dataset.deleteId = a.id;
                    delBtn.textContent = 'Delete';
                    tdDel.appendChild(delBtn);
                    tr.appendChild(tdDel);

                    tbody.appendChild(tr);
                });
            })
            .catch(() => showBanner('Failed to load agencies.'));
    }

    /* ── Add agency ── */
    let _pendingFormData = null;
    const addModal = new bootstrap.Modal(document.getElementById('addModal'));

    document.getElementById('add-form').addEventListener('submit', function (e) {
        e.preventDefault();
        _pendingFormData = new URLSearchParams(new FormData(this));
        document.getElementById('add-access-key').value = '';
        addModal.show();
    });

    document.getElementById('add-confirm-btn').addEventListener('click', function () {
        if (!_pendingFormData) return;
        const formData = _pendingFormData;
        _pendingFormData = null;

        const key = document.getElementById('add-access-key').value;
        addModal.hide();

        fetch('/api/agencies/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'x-access-key': key,
            },
            body: formData,
        })
            .then(r => {
                if (r.ok) {
                    window.location.reload();
                } else if (r.status === 401) {
                    showBanner('Invalid access key.');
                } else {
                    return r.json().then(t => { throw new Error(t.error || `Server error ${r.status}`); });
                }
            })
            .catch(err => showBanner(`Failed to add agency: ${err.message}`));
    });

    /* ── Delete agency — event delegation, no inline onclick ── */
    let _pendingDelete = null;
    const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

    document.getElementById('agency-tbody').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-delete-id]');
        if (!btn) return;

        const id = btn.dataset.deleteId;
        const name = btn.closest('tr').querySelector('td strong').textContent;
        _pendingDelete = { id, btn };

        document.getElementById('delete-modal-msg').textContent =
            `Delete "${name}"? This cannot be undone.`;
        document.getElementById('delete-access-key').value = '';
        deleteModal.show();
    });

    document.getElementById('delete-confirm-btn').addEventListener('click', function () {
        if (!_pendingDelete) return;
        const { id, btn } = _pendingDelete;
        _pendingDelete = null;

        const key = document.getElementById('delete-access-key').value;
        deleteModal.hide();
        btn.disabled = true;

        fetch(`/api/agencies/delete/${id}`, {
            method: 'DELETE',
            headers: { 'x-access-key': key },
        })
            .then(r => {
                if (r.status === 204) {
                    const row = document.querySelector(`tr[data-id="${id}"]`);
                    if (row) row.remove();
                    if (document.getElementById('agency-tbody').children.length === 0) {
                        const emptyRow = document.createElement('tr');
                        emptyRow.id = 'empty-row';
                        const emptyCell = document.createElement('td');
                        emptyCell.colSpan = 9;
                        emptyCell.className = 'text-center py-4';
                        emptyCell.style.cssText = 'color:var(--text-muted);font-style:italic;';
                        emptyCell.textContent = 'No agencies added yet.';
                        emptyRow.appendChild(emptyCell);
                        document.getElementById('agency-tbody').appendChild(emptyRow);
                    }
                } else if (r.status === 401) {
                    showBanner('Invalid access key.');
                    btn.disabled = false;
                } else {
                    r.json().then(t => { showBanner(`Failed to delete agency: ${t.error || `Server error ${r.status}`}`); });
                    btn.disabled = false;
                }
            })
            .catch(() => {
                showBanner('Network error while deleting agency.');
                btn.disabled = false;
            });
    });

    loadAgencies();
</script>

</html>
