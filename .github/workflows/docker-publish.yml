name: Build and publish Docker images

# Fires on every merge to master (push event) and is available as a
# manual button on the Actions tab via workflow_dispatch.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Build the daemon and the web image in parallel — they share no source
# and have their own Dockerfiles, so there's no point serialising them.
# Each job pushes two tags to Docker Hub:
#   - a stable mutable tag matching `make docker` / `make docker-web`
#     (`latest` for the daemon, `web` for the express+SPA image)
#   - an immutable `…-<sha>` tag so we can roll deployments back to a
#     specific commit if a release goes sideways.
#
# Required repo secrets (set under Settings → Secrets and variables →
# Actions):
#   DOCKERHUB_USERNAME — Docker Hub login (e.g. ranjitnovascotia)
#   DOCKERHUB_TOKEN    — Docker Hub access token with read/write scope
permissions:
  contents: read

jobs:
  daemon:
    name: Daemon (C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The generated GTFS-realtime protobuf files (`transit_realtime.proto`,
      # `.pb.h`, `.pb.cc`) are gitignored, so we regenerate them on the runner
      # before the Docker build picks up `daemon/` via COPY. Mirrors the local
      # `make get-protobuf-headers` target.
      - name: Generate GTFS-realtime protobuf files
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          curl -fsSL "https://gtfs.org/documentation/realtime/gtfs-realtime.proto" \
            -o ./daemon/assets/transit_realtime.proto
          protoc --cpp_out=. ./daemon/assets/transit_realtime.proto

      # QEMU + Buildx give us cross-arch builds (linux/amd64 + linux/arm64)
      # to match the local `make docker` target's --platform flag.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./daemon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ranjitnovascotia/locate-my-bus:latest
            ranjitnovascotia/locate-my-bus:daemon-${{ github.sha }}
          # Per-job buildx cache so the daemon and web jobs don't fight
          # over the same scope.
          cache-from: type=gha,scope=daemon
          cache-to: type=gha,mode=max,scope=daemon

  web:
    name: Web (Express + React SPA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ranjitnovascotia/locate-my-bus:web
            ranjitnovascotia/locate-my-bus:web-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
